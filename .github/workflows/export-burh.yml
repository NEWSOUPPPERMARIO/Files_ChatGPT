name: Export BURH ZIP
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-burh.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Upload BURH.zip as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: BURH-zip
          path: BURH.zip
          if-no-files-found: error
          retention-days: 1
